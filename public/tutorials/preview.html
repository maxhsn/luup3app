<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tutorial Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden; font-family:'Geist','Inter',system-ui,sans-serif; }
  #root { position:absolute; inset:0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  @keyframes sheetSlide { from { opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#a1a1aa; font-size:14px; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Foundation: stage + frames + UI kits (reused) -->
<script type="text/babel" src="../frames/animations.jsx"></script>
<script type="text/babel" src="../frames/browser-window.jsx"></script>
<script type="text/babel" src="../frames/ios-frame.jsx"></script>
<script type="text/babel" src="../merchant-ui.jsx"></script>

<!-- Tutorial runtime -->
<script type="text/babel" src="runtime/engine.jsx"></script>
<script type="text/babel" src="runtime/visuals.jsx"></script>
<script type="text/babel" src="runtime/Tutorial.jsx"></script>

<!-- Scenes -->
<script type="text/babel" src="scenes/merchant.dashboard.desktop.jsx"></script>
</head>
<body>
<div id="root"><div class="loading">Loading tutorial…</div></div>

<script type="text/babel" data-presets="react">
const StageEl = window.Stage;
const TutorialEl = window.Tutorial;

// Theme registry — keep in sync with themes/*.json
const THEMES = {
  luup: {
    name: 'Luup',
    fonts: { display: "'Geist', 'Inter', system-ui, sans-serif", body: "'Geist', 'Inter', system-ui, sans-serif", mono: "'Geist Mono', monospace" },
    colors: { bg:'#fafaf9', surface:'#ffffff', muted:'#f5f5f4', mutedSoft:'#fafaf9', border:'#e7e5e4', fg:'#0c0a09', mutedFg:'#78716c', accent:'#6366f1', accentSoft:'#eef2ff', accentRing:'#a5b4fc', emerald:'#10b981', amber:'#f59e0b', rose:'#f43f5e' },
    radii: { sm:6, md:9, lg:14, xl:20, pill:999 },
    shadows: { sm:'0 1px 2px rgba(0,0,0,0.04)', md:'0 4px 12px rgba(0,0,0,0.08)', lg:'0 12px 40px rgba(0,0,0,0.12)' },
  },
  cm: {
    name: 'Combat Athletics',
    fonts: { display: "'Geist', 'Inter', system-ui, sans-serif", body: "'Geist', 'Inter', system-ui, sans-serif", mono: "'Geist Mono', monospace" },
    colors: { bg:'#0a0a0a', surface:'#141414', muted:'#1c1c1c', mutedSoft:'#161616', border:'#2a2a2a', fg:'#fafafa', mutedFg:'#9ca3af', accent:'#dc2626', accentSoft:'#1f0f0f', accentRing:'#ef4444', emerald:'#10b981', amber:'#f59e0b', rose:'#f43f5e' },
    radii: { sm:4, md:6, lg:10, xl:14, pill:999 },
    shadows: { sm:'0 1px 2px rgba(0,0,0,0.4)', md:'0 4px 12px rgba(0,0,0,0.5)', lg:'0 12px 40px rgba(0,0,0,0.6)' },
  },
};

// Default script (override via ?script= query param)
const DEFAULT_SCRIPT = 'scripts/merchant-create-mission.json';

async function loadScript() {
  const params = new URLSearchParams(window.location.search);
  const path = params.get('script') || DEFAULT_SCRIPT;
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error('Failed to load: ' + path);
    return await res.json();
  } catch (e) {
    console.error('Tutorial load error:', e);
    document.getElementById('root').innerHTML =
      '<div class="loading" style="color:#f87171;flex-direction:column;gap:8px"><div>Failed to load <code>' + path +
      '</code></div><div style="font-size:12px;color:#71717a">If running locally, serve via <code>http://</code> not <code>file://</code></div></div>';
    return null;
  }
}

(async () => {
  const script = await loadScript();
  if (!script) return;

  const Scene = window.SCENE_REGISTRY[script.scene];
  if (!Scene) {
    document.getElementById('root').innerHTML =
      '<div class="loading" style="color:#f87171">Unknown scene: ' + script.scene + '</div>';
    return;
  }

  const theme = THEMES[script.theme] || THEMES.luup;
  const aspect = script.aspect || '16:9';
  const [w, h] = aspect === '9:19.5' ? [1170, 2532] : [1920, 1080];

  const App = () => (
    <StageEl
      width={w}
      height={h}
      duration={script.duration || 30}
      background={theme.colors.bg === '#fafaf9' ? '#0f0f10' : '#0a0a0a'}
      persistKey={'tut:' + script.id}
    >
      <TutorialEl script={script} theme={theme} sceneComponent={Scene} stageWidth={w} stageHeight={h} />
    </StageEl>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>
</body>
</html>
